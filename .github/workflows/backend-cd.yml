name: Backend Build

on:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobhunter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobhunter?schema=public
      JWT_ACCESS_TOKEN_SECRET: test-secret
      JWT_ACCESS_EXPIRE: 15m
      JWT_REFRESH_TOKEN_SECRET: test-refresh-secret
      JWT_REFRESH_EXPIRE: 1d
      PORT: 8000
      CLIENT_URL: http://localhost:3000
      NODE_ENV: test
      SHOULD_INIT: false
      INIT_PASSWORD: 123456

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync schema to CI database
        run: npx prisma db push

      - name: Build
        run: npm run build
